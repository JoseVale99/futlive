<app-loading-bar />
<main class="min-h-screen bg-linear-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-950 font-sans antialiased text-gray-900 dark:text-white transition-colors duration-300">
  <!-- Header -->
  <header [class]="'sticky top-0 z-30 backdrop-blur-xl bg-white/90 dark:bg-gray-900/90 border-b border-gray-200 dark:border-gray-800 shadow-lg transition-transform duration-300 ' + (headerHidden() ? '-translate-y-full' : 'translate-y-0')"
  >
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="relative">
          <img src="icons/logo.png" alt="FutLive" class="w-10 h-10 rounded-xl object-contain">
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-gray-900 dark:text-white">
            Fut<span class="text-transparent bg-clip-text bg-linear-to-r from-green-500 to-emerald-500 dark:from-green-400 dark:to-emerald-400">Live</span>
          </h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">World Cup 2026</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-1" aria-label="Navegación principal">
          @for (link of links; track link.path) {
            <a
              [routerLink]="[link.path]"
              [class]="isActive(link.path)
                ? 'relative px-3 py-1.5 rounded-lg text-sm transition-all flex items-center gap-1.5 text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 font-black'
                : 'relative px-3 py-1.5 rounded-lg text-sm transition-all flex items-center gap-1.5 text-gray-600 dark:text-gray-400 font-semibold hover:text-gray-700 dark:hover:text-gray-200'"
            >
              <svg
                [attr.fill]="isActive(link.path) ? 'currentColor' : 'none'"
                [attr.stroke]="isActive(link.path) ? 'none' : 'currentColor'"
                [attr.stroke-width]="isActive(link.path) ? 0 : 2"
                class="w-4 h-4 transition-transform shrink-0"
                [class.scale-110]="isActive(link.path)"
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round"
                  [attr.d]="isActive(link.path) ? link.iconActive : link.iconInactive"/>
              </svg>
              {{ link.label }}
            </a>
          }
        </nav>
        <div class="hidden md:flex items-center gap-2 text-sm font-semibold text-gray-500 dark:text-gray-400">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
          </span>
          Live
        </div>
        <app-theme-toggle />
      </div>
    </div>
  </header>

  <!-- Content -->
  <router-outlet />

  <!-- Mobile Navigation -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 backdrop-blur-xl bg-white/95 dark:bg-gray-900/95 border-t border-gray-200 dark:border-gray-800 px-2 py-2 flex justify-around items-center shadow-xl" aria-label="Navegación principal">
    @for (link of links; track link.path) {
      <a
        [routerLink]="[link.path]"
        [class]="isActive(link.path)
          ? 'flex flex-col items-center min-h-12 min-w-16 justify-center transition-colors relative px-3 py-1.5 rounded-xl text-blue-600 dark:text-blue-400'
          : 'flex flex-col items-center min-h-12 min-w-16 justify-center transition-colors relative px-3 py-1.5 rounded-xl text-gray-400 dark:text-gray-500'"
      >
        <span
          [class.opacity-100]="isActive(link.path)"
          [class.scale-100]="isActive(link.path)"
          [class.opacity-0]="!isActive(link.path)"
          [class.scale-50]="!isActive(link.path)"
          class="absolute -top-0.5 left-1/2 -translate-x-1/2 w-8 h-1 rounded-full bg-blue-500 transition-all duration-200"
        ></span>
        <svg
          [attr.fill]="isActive(link.path) ? 'currentColor' : 'none'"
          [attr.stroke]="isActive(link.path) ? 'none' : 'currentColor'"
          [attr.stroke-width]="isActive(link.path) ? 0 : 2"
          class="w-6 h-6 mb-0.5 transition-transform"
          [class.scale-110]="isActive(link.path)"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round"
            [attr.d]="isActive(link.path) ? link.iconActive : link.iconInactive"/>
        </svg>
        <span [class.font-black]="isActive(link.path)" [class.font-bold]="!isActive(link.path)" class="text-[10px] uppercase tracking-wide">
          {{ link.label }}
        </span>
      </a>
    }
  </nav>
</main>
